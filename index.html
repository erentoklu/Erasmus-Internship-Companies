<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>internErasmus</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Grafikler için Chart.js Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header class="header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div style="display: flex; align-items: center; gap: 2.5rem; flex-wrap: wrap;">
            <div class="logo">intern<span>Erasmus</span></div>
            <nav class="tabs" style="margin-left: 2rem;">
                <button class="tab-btn active" data-tab="cold">Companies <span id="companies-count">(0)</span></button>
                <button class="tab-btn" data-tab="kaydedilenler">Saved Companies <span id="saved-count">(0)</span></button>
            </nav>
        </div>

        <div style="display: flex; align-items: center; gap: 1.5rem;">
            <div style="display: flex; gap: 1.5rem; margin-right: 1.5rem;">
                <button class="tab-btn" data-tab="recommendations" style="font-size: 0.9rem;">Recommendations & Feedback</button>
                <button class="tab-btn" data-tab="analytics" style="font-size: 0.9rem;">Analytics</button>
                <button class="tab-btn" data-tab="about" style="font-size: 0.9rem;">About</button>
            </div>
            <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
                <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg id="sun-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </div>
    </header>

    <main class="container">
        <div class="search-filter-section">
            <div class="primary-filters">
                <input type="text" id="search-input" class="filter-input search-box" placeholder="Search company, keyword...">
                
                <select id="location-select" class="filter-input custom-select">
                    <option value="All">All Locations</option>
                    <option value="International">International</option>
                    <option value="Austria">Austria</option>
                    <option value="Belgium">Belgium</option>
                    <option value="Bulgaria">Bulgaria</option>
                    <option value="Croatia">Croatia</option>
                    <option value="Cyprus">Cyprus</option>
                    <option value="Czechia">Czechia</option>
                    <option value="Denmark">Denmark</option>
                    <option value="Estonia">Estonia</option>
                    <option value="Finland">Finland</option>
                    <option value="France">France</option>
                    <option value="Germany">Germany</option>
                    <option value="Greece">Greece</option>
                    <option value="Hungary">Hungary</option>
                    <option value="Iceland">Iceland</option>
                    <option value="Ireland">Ireland</option>
                    <option value="Italy">Italy</option>
                    <option value="Latvia">Latvia</option>
                    <option value="Liechtenstein">Liechtenstein</option>
                    <option value="Lithuania">Lithuania</option>
                    <option value="Luxembourg">Luxembourg</option>
                    <option value="Malta">Malta</option>
                    <option value="Netherlands">Netherlands</option>
                    <option value="North Macedonia">North Macedonia</option>
                    <option value="Norway">Norway</option>
                    <option value="Poland">Poland</option>
                    <option value="Portugal">Portugal</option>
                    <option value="Romania">Romania</option>
                    <option value="Serbia">Serbia</option>
                    <option value="Slovakia">Slovakia</option>
                    <option value="Slovenia">Slovenia</option>
                    <option value="Spain">Spain</option>
                    <option value="Sweden">Sweden</option>
                    <option value="Türkiye">Türkiye</option>
                    <option value="United Kingdom">United Kingdom</option>
                </select>

                <select id="field-select" class="filter-input custom-select">
                    <option value="All">All Categories</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Visual Arts">Visual Arts</option>
                    <option value="Medicine">Medicine</option>
                    <option value="Business">Business</option>
                    <option value="Architecture">Architecture</option>
                    <option value="Law">Law</option>
                    <option value="Education">Education</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Design">Design</option>
                    <option value="Finance">Finance</option>
                    <option value="IT & Software">IT & Software</option>
                    <option value="Natural Sciences">Natural Sciences</option>
                    <option value="Humanities">Humanities</option>
                    <option value="Media & Communications">Media & Communications</option>
                    <option value="Hospitality & Tourism">Hospitality & Tourism</option>
                </select>

                <select id="subcategory-select" class="filter-input custom-select hidden">
                    <option value="All">All Subcategories</option>
                    <option value="Electrical">Electrical</option>
                    <option value="Mechanical">Mechanical</option>
                    <option value="Software">Software</option>
                    <option value="Computer">Computer</option>
                    <option value="Civil">Civil</option>
                    <option value="Industrial">Industrial</option>
                    <option value="Aerospace">Aerospace</option>
                </select>
            </div>
        </div>

        <section class="job-board">
            <div id="job-container" class="job-grid"></div>
        </section>
    </main>

    <div id="job-modal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button id="close-modal" class="modal-close-btn" aria-label="Close">✕</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Netlify'ın formu algılayabilmesi için gerekli görünmez form -->
    <form name="feedback-form" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input type="text" name="topic" />
        <textarea name="message"></textarea>
    </form>

    <script src="script.js"></script>
</body>
</html>
